<div class="app-shell">
  <header class="app-header">
    <div class="app-header__start">
      <app-logo [compact]="isCompactChrome()" [homeLink]="links.home" />
    </div>

    <div class="app-header__search">
      <ng-content select="[header-search]" />
    </div>

    <a [routerLink]="links.jobs" class="app-header__jobs-link">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none" />
        <path d="M16.5 16.5 L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      <span>Find jobs</span>
    </a>

    <div class="app-header__actions">
      <ng-content select="[header-actions]" />

      <nav class="app-nav" aria-label="Main">
        <a [routerLink]="links.jobs" routerLinkActive="is-active">Jobs</a>
      </nav>

      <div class="app-auth">
        <app-theme-toggle [compact]="isCompactChrome()" />
        <app-profile-menu
          [compact]="isCompactChrome()"
          [links]="profileMenuLinks"
          [loading]="auth.loading()"
          [authenticated]="auth.isAuthenticated()"
          [displayName]="auth.user()?.displayName ?? null"
          (signIn)="auth.signInWithGoogle()"
          (signOut)="auth.signOut()"
        />
      </div>
    </div>
  </header>

  <ng-content select="[filter-drawer]" />

  <main class="app-main">
    <ng-content />
  </main>
</div>
