<div class="app-shell">
  <header class="app-header">
    <div class="app-header__start">
      <app-logo [compact]="isMobileLayout()" [homeLink]="links.home" />
    </div>

    <div class="app-header__search">
      <app-header-search />
    </div>

    <a [routerLink]="links.jobs" class="app-header__jobs-link">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none" />
        <path d="M16.5 16.5 L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      <span>Find jobs</span>
    </a>

    <div class="app-header__actions">
      @if (headerUi.filtersEnabled()) {
        <button
          type="button"
          class="header-action"
          [class.header-action--active]="headerUi.filtersOpen()"
          [attr.aria-expanded]="headerUi.filtersOpen()"
          aria-controls="app-filter-drawer"
          (click)="headerUi.toggleFilters()"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              d="M4 6 H20 M7 12 H17 M10 18 H14"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <span>Filters</span>
          @if (headerUi.activeFilterCount() > 0) {
            <span class="header-action__badge" aria-label="{{ headerUi.activeFilterCount() }} active filters">
              {{ headerUi.activeFilterCount() }}
            </span>
          }
        </button>
      }

      <nav class="app-nav" aria-label="Main">
        <a [routerLink]="links.jobs" routerLinkActive="is-active">Jobs</a>
      </nav>

      <div class="app-auth">
        <app-theme-toggle [compact]="isMobileLayout()" />
        <app-profile-menu [compact]="isMobileLayout()" />
      </div>
    </div>
  </header>

  <app-filter-drawer
    id="app-filter-drawer"
    [open]="headerUi.filtersEnabled() && headerUi.filtersOpen()"
    (closed)="headerUi.closeFilters()"
  >
    <ng-content select="[filter-panel]" />
  </app-filter-drawer>

  <main class="app-main">
    <ng-content />
  </main>

  <app-toast-host />
</div>
