<div
  class="app-shell"
  [class.app-shell--header-hidden]="headerCollapsed()"
>
  <header class="app-header">
    <div class="app-header__start">
      <app-logo [homeLink]="links.home" />
    </div>

    <app-header-search />

    <div class="app-header__actions">
      @if (headerUi.filtersEnabled()) {
        <button
          type="button"
          class="header-action"
          [class.header-action--active]="headerUi.filtersOpen()"
          [attr.aria-expanded]="headerUi.filtersOpen()"
          aria-controls="app-filter-drawer"
          (click)="headerUi.toggleFilters()"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              d="M4 6 H20 M7 12 H17 M10 18 H14"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <span>Filters</span>
          @if (headerUi.activeFilterCount() > 0) {
            <span class="header-action__badge" aria-label="{{ headerUi.activeFilterCount() }} active filters">
              {{ headerUi.activeFilterCount() }}
            </span>
          }
        </button>
      }

      <nav class="app-nav" aria-label="Main">
        <a [routerLink]="links.jobs" routerLinkActive="is-active">Jobs</a>
      </nav>

      <div class="app-auth">
        @if (auth.isAuthenticated()) {
          <div #profileMenu class="profile-menu">
            <button
              type="button"
              class="profile-menu__trigger"
              [class.is-open]="profileMenuOpen()"
              [attr.aria-expanded]="profileMenuOpen()"
              aria-haspopup="menu"
              [attr.aria-controls]="profileMenuOpen() ? 'profile-menu-panel' : null"
              (click)="toggleProfileMenu()"
            >
              <span class="profile-menu__avatar" aria-hidden="true">{{ userInitials() }}</span>
              <span class="profile-menu__name">{{ auth.user()?.displayName ?? 'Profile' }}</span>
              <svg class="profile-menu__chevron" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path d="M7 10 L12 15 L17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
              </svg>
            </button>

            @if (profileMenuOpen()) {
              <div id="profile-menu-panel" class="profile-menu__popover" role="menu">
                <a
                  [routerLink]="links.saved"
                  routerLinkActive="is-active"
                  class="profile-menu__item"
                  role="menuitem"
                  (click)="closeProfileMenu()"
                >
                  Saved
                </a>
                <a
                  [routerLink]="links.profile"
                  routerLinkActive="is-active"
                  class="profile-menu__item"
                  role="menuitem"
                  (click)="closeProfileMenu()"
                >
                  Profile
                </a>
                <button type="button" class="profile-menu__item profile-menu__item--danger" role="menuitem" (click)="signOut()">
                  Sign out
                </button>
              </div>
            }
          </div>
        } @else {
          <button type="button" class="btn btn-primary btn-sm" (click)="signIn()">Sign in</button>
        }
      </div>
    </div>
  </header>

  <app-filter-drawer
    id="app-filter-drawer"
    [open]="headerUi.filtersEnabled() && headerUi.filtersOpen()"
    (closed)="headerUi.closeFilters()"
  >
    <ng-content select="[filter-panel]" />
  </app-filter-drawer>

  <main class="app-main">
    <ng-content />
  </main>

  <app-toast-host />
</div>
