<form class="header-search-compact" role="search" (submit)="onSubmit($event)">
  <div class="header-search-compact__group header-search-compact__group--jobs">
    <label class="visually-hidden" for="header-search-compact-jobs">Search jobs</label>
    <svg class="header-search-compact__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none" />
      <path d="M16.5 16.5 L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
    <input
      id="header-search-compact-jobs"
      class="header-search-compact__input"
      type="search"
      name="q"
      placeholder="Title, company, skill, keyword…"
      autocomplete="off"
      enterkeyhint="search"
      [value]="query()"
      (input)="onQueryChange($any($event.target).value)"
    />
  </div>

  <div class="header-search-compact__group header-search-compact__group--location">
    <div class="header-search-compact__field">
      <label class="visually-hidden" for="header-search-compact-location">Location</label>
      <svg class="header-search-compact__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path
          d="M12 21s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10Z"
          stroke="currentColor"
          stroke-width="2"
          fill="none"
        />
        <circle cx="12" cy="11" r="2.5" stroke="currentColor" stroke-width="2" fill="none" />
      </svg>
      <input
        id="header-search-compact-location"
        class="header-search-compact__input header-search-compact__input--location"
        type="search"
        name="location"
        placeholder="City or region"
        autocomplete="off"
        [value]="locationQuery()"
        (input)="onLocationChange($any($event.target).value)"
      />
    </div>

    <div class="header-search-compact__radius-field">
      <button
        type="button"
        id="header-search-compact-radius"
        class="header-search-compact__radius"
        aria-haspopup="listbox"
        [attr.aria-expanded]="radiusPanelOpen()"
        aria-controls="header-search-compact-radius-panel"
        (click)="toggleRadiusPanel($event)"
      >
        <svg class="header-search-compact__radius-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.75" fill="none" />
          <circle cx="12" cy="12" r="2.5" fill="currentColor" />
        </svg>
        <span class="header-search-compact__radius-label">{{ radiusKm() }} km</span>
        <svg class="header-search-compact__radius-chevron" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true">
          <path
            d="M3 4.5 L6 7.5 L9 4.5"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
          />
        </svg>
      </button>

      @if (radiusPanelOpen()) {
        <ul
          id="header-search-compact-radius-panel"
          class="header-search-compact__radius-panel"
          role="listbox"
          aria-label="Search radius"
        >
          @for (radius of radiusOptions; track radius) {
            <li role="presentation">
              <button
                type="button"
                class="header-search-compact__radius-option"
                role="option"
                [class.is-active]="radiusKm() === radius"
                [attr.aria-selected]="radiusKm() === radius"
                (mousedown)="$event.preventDefault()"
                (click)="selectRadius(radius)"
              >
                <span>{{ radius }} km</span>
                @if (radiusKm() === radius) {
                  <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                    <path
                      d="M3.5 8.5 L6.5 11.5 L12.5 4.5"
                      stroke="currentColor"
                      stroke-width="1.75"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      fill="none"
                    />
                  </svg>
                }
              </button>
            </li>
          }
        </ul>
      }
    </div>
  </div>

  <button type="submit" class="header-search-compact__submit" aria-label="Search jobs">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none" />
      <path d="M16.5 16.5 L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
    <span>Search</span>
  </button>
</form>
