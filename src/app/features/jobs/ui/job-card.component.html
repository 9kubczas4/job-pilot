<article class="card" [class.is-selected]="selected()">
  <div class="job-card__header">
    <div>
      <h3 class="job-card__title">{{ job().title }}</h3>
      <p class="job-card__company">{{ job().company.name }}</p>
    </div>
    <div class="job-card__badges cluster">
      @if (saved()) {
        <span class="badge">Saved</span>
      }
      @if (applied()) {
        <span class="badge badge--success">Applied</span>
      }
    </div>
  </div>

  <p class="job-card__meta">{{ formatWorkplace(job()) }}</p>
  @if (formatSalary(job()); as salary) {
    <p class="job-card__salary">{{ salary }}</p>
  }

  <div class="cluster job-card__skills">
    @for (skill of job().skills.slice(0, 4); track skill.name) {
      <span class="chip">{{ skill.name }}</span>
    }
  </div>
</article>
