<section class="filters-panel">
  <div class="field">
    <label for="filter-location">Location</label>
    <input
      id="filter-location"
      class="input"
      type="text"
      name="location"
      placeholder="City, region or country"
      autocomplete="address-level2"
      [ngModel]="locationValue()"
      (ngModelChange)="updateLocation($event)"
    />
  </div>

  <fieldset class="filters-fieldset">
    <legend>Workplace</legend>
    <div class="cluster">
      @for (option of workplaceOptions; track option) {
        <button
          type="button"
          class="chip-btn"
          [class.is-active]="isWorkplaceActive(option)"
          (click)="toggleWorkplace(option)"
        >
          {{ option }}
        </button>
      }
    </div>
  </fieldset>

  @if (activeChips().length) {
    <div class="field">
      <span class="field-label">Active filters</span>
      <div class="cluster">
        @for (chip of activeChips(); track chip.key) {
          <button type="button" class="chip chip--removable" (click)="removeChip(chip.key)">
            {{ chip.label }} ×
          </button>
        }
      </div>
    </div>
  }

  <div class="filters-panel__footer">
    <button type="button" class="btn btn-ghost" (click)="store.clearCriteria()">Clear all</button>
  </div>
</section>
