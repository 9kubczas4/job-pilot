@if (!mapsConfigured) {
  <div class="map-placeholder">
    <p class="map-placeholder__title">Map unavailable</p>
    <p class="map-placeholder__text">Add a Google Maps API key to <code>environment.googleMapsApiKey</code>.</p>
  </div>
} @else if (mapError()) {
  <div class="map-placeholder">
    <p class="map-placeholder__title">Map unavailable</p>
    <p class="map-placeholder__text">Google Maps authentication failed. Check your API key and billing settings.</p>
  </div>
} @else {
  <google-map
    class="map-container"
    height="100%"
    width="100%"
    [options]="mapOptions"
    (mapInitialized)="onMapReady($event)"
    (authFailure)="onAuthFailure()"
  />
}
