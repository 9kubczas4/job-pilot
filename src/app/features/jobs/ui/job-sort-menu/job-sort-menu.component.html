<div class="sort-menu">
  <button
    type="button"
    class="sort-menu__trigger"
    [class.sort-menu__trigger--ai-updating]="aiUpdateActive()"
    [attr.aria-busy]="aiUpdateActive()"
    aria-haspopup="listbox"
    [attr.aria-expanded]="panelOpen()"
    (click)="togglePanel($event)"
  >
    <svg class="sort-menu__icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <path
        d="M7 4v16M7 4l-3 3M7 4l3 3M17 20V4M17 20l-3-3M17 20l3-3"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
    </svg>
    <span class="sort-menu__label">{{ currentLabel() }}</span>
    <svg class="sort-menu__chevron" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true">
      <path
        d="M3 4.5 L6 7.5 L9 4.5"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
    </svg>
  </button>

  @if (panelOpen()) {
    <ul class="sort-menu__panel" role="listbox" aria-label="Sort jobs">
      @for (option of options(); track option.value) {
        <li role="presentation">
          <button
            type="button"
            class="sort-menu__option"
            role="option"
            [class.is-active]="value() === option.value"
            [attr.aria-selected]="value() === option.value"
            (mousedown)="$event.preventDefault()"
            (click)="selectSort(option.value)"
          >
            <span>{{ option.label }}</span>
            @if (value() === option.value) {
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                <path
                  d="M3.5 8.5 L6.5 11.5 L12.5 4.5"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  fill="none"
                />
              </svg>
            }
          </button>
        </li>
      }
    </ul>
  }
</div>
