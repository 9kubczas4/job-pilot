<a [routerLink]="homeLink()" class="logo" aria-label="Job Pilot — home">
  <svg
    class="logo__mark"
    viewBox="0 0 32 32"
    width="32"
    height="32"
    aria-hidden="true"
    focusable="false"
  >
    <defs>
      <linearGradient id="logo-gradient" x1="4" y1="28" x2="28" y2="4" gradientUnits="userSpaceOnUse">
        <stop stop-color="#2563eb" />
        <stop offset="1" stop-color="#4338ca" />
      </linearGradient>
    </defs>
    <rect width="32" height="32" rx="9" fill="url(#logo-gradient)" />
    <path
      d="M8 20 L16 8 L24 20 L20 20 L20 24 L12 24 L12 20 Z"
      fill="white"
      fill-opacity="0.95"
    />
    <circle cx="16" cy="14" r="2" fill="white" />
  </svg>

  @if (!compact()) {
    <span class="logo__wordmark">
      <span class="logo__name">Job</span><span class="logo__accent">Pilot</span>
    </span>
  }
</a>
